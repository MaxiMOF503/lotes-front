name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Pruebas y build de producción
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar reportes
        run: mkdir -p reports

      - name: Probar exportador de informes
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee reports/tests.log

      - name: Compilar para producción
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee reports/build.log

      - name: Guardar diagnóstico de fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-ci-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 7
