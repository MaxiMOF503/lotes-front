<div class="buscador">
  <div class="buscador-title"><span>⌕</span><div><strong>Encontrá un lote</strong><small>Elegí cómo querés buscar</small></div></div>
  <div class="modo-toggle">
    <button
      [class.activo]="modoBusqueda === 'identificador'"
      (click)="modoBusqueda = 'identificador'">
      <span>▤</span> Por identificador
    </button>
    <button
      [class.activo]="modoBusqueda === 'direccion'"
      (click)="modoBusqueda = 'direccion'">
      <span>⌖</span> Por dirección
    </button>
  </div>

  <form (ngSubmit)="buscar()" class="formulario">
    <div class="campo" *ngIf="modoBusqueda === 'identificador'">
      <label for="identificador">Identificador del lote</label>
      <input
        id="identificador"
        type="text"
        [(ngModel)]="identificador"
        name="identificador"
        placeholder="Ej: LOT-DEMO-001"
        maxlength="100">
    </div>

    <div class="campo" *ngIf="modoBusqueda === 'direccion'">
      <label for="direccion">Dirección aproximada</label>
      <input id="direccion" type="search" [(ngModel)]="direccion" name="direccion"
        placeholder="Ej: Calle Demostración 123, Mendoza" minlength="3" maxlength="255">
      <small>Ingresá al menos 3 caracteres. Si hay varios lotes, podrás elegir uno.</small>
    </div>

    <div class="acciones">
      <button type="submit" class="btn-buscar">Buscar lote <span>→</span></button>
      <button type="button" class="btn-limpiar" (click)="limpiar()">Limpiar</button>
    </div>
  </form>
</div>
