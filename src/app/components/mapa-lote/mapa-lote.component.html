<div class="map-shell">
  <div #mapaContainer class="mapa"></div>
  <button type="button" class="layers-trigger" (click)="alternarPanel()" [attr.aria-expanded]="panelCapasAbierto">
    <span class="layers-icon" aria-hidden="true"><i></i><i></i><i></i></span> Capas del territorio <b>{{ panelCapasAbierto ? '×' : '+' }}</b>
  </button>
  <aside class="layers-panel" [class.is-open]="panelCapasAbierto" aria-label="Capas territoriales">
    <header><span>Datos territoriales</span><strong>Elegí qué información querés ver</strong></header>
    <div class="layers-list">
      <button *ngFor="let capa of capas" type="button" class="layer-row" [class.is-active]="capa.remota ? capa.seleccionada : capa.estado === 'active'" [class.is-loading]="capa.estado === 'loading'" [class.is-disabled]="!capa.disponible" (click)="alternarCapa(capa)" [disabled]="!capa.disponible" [attr.aria-pressed]="capa.remota ? !!capa.seleccionada : capa.estado === 'active'">
        <i class="layer-swatch" [style.--layer-color]="capa.color"></i>
        <span><strong>{{ capa.nombre }}</strong><small>{{ capa.detalle }}</small><small *ngIf="capa.estado === 'loading'">Cargando…</small><em *ngIf="capa.aviso">{{ capa.aviso }}</em><em *ngIf="capa.nota">{{ capa.nota }}</em></span>
        <b>{{ capa.estado === 'active' ? '✓' : capa.estado === 'error' ? '!' : !capa.disponible ? 'Próximamente' : '+' }}</b>
      </button>
    </div>
    <footer>Hacé clic sobre una zona del mapa para ver su información.</footer>
  </aside>
  <div class="layer-feedback" *ngIf="avisoCapas" role="status">{{ avisoCapas }}</div>
  <div class="map-hint"><span></span> Clic en el mapa · Parcela y servicios reales</div>
</div>
